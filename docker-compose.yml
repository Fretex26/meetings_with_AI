services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    container_name: mwai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mwai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-mwai}
    ports:
      - 5432:5432
    volumes:
      - mwai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mwai} -d ${DB_NAME:-mwai}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.2
    container_name: mwai-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@mwai.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mwai_pgadmin_data:/var/lib/pgadmin

volumes:
  mwai_postgres_data:
  mwai_pgadmin_data: